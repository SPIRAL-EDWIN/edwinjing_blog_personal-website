{% if edwinos_intro_phase == "head" %}
<script>
(function () {
  var defaults = {mode: 'first-visit', entryScope: 'any', storageScope: 'session'};
  var config = Object.assign(defaults, {{ config.extra.loader | default({}) | tojson }});
  var root = document.documentElement;
  var boot = window.__edwinosIntroBoot = {config: config, started: performance.now(), active: false};
  var params = new URLSearchParams(location.search);
  var query = params.get('intro');
  boot.debugQuestion = query === '1' ? params.get('q') : null;
  // Material uses ?q= for search. Consume only intro's forced-question debug
  // parameter before Material initializes; ordinary search URLs stay intact.
  if (boot.debugQuestion) {
    try {
      var url = new URL(location.href);
      url.searchParams.delete('q');
      history.replaceState(history.state, '', url.pathname + url.search + url.hash);
    } catch (_) { /* The opening must remain usable if URL rewriting is denied. */ }
  }
  var isHome = {{ (page.url in ["", "index.html"]) | tojson }};
  var seen = false;
  try {
    var storage = config.storageScope === 'local' ? localStorage : sessionStorage;
    seen = storage.getItem('edwinos:intro:v1') === 'seen';
  } catch (_) { /* Storage denial must never prevent access to the page. */ }
  var navigation = performance.getEntriesByType('navigation')[0];
  var repeatedDocument = navigation && (navigation.type === 'reload' || navigation.type === 'back_forward');
  boot.active = query === '1' || (query !== '0' && config.mode !== 'off' &&
    (config.entryScope !== 'home-only' || isHome) &&
    (config.mode === 'always' || (!seen && !repeatedDocument)));
  if (!boot.active) return;
  try { storage.setItem('edwinos:intro:v1', 'seen'); } catch (_) {}
  root.classList.add('edwinos-intro-pending');
  // Independent fail-open: even a missing runtime or script error cannot trap a reader.
  boot.timer = setTimeout(function () {
    root.classList.remove('edwinos-intro-pending');
    var shell = document.getElementById('edwinos-intro');
    if (shell) shell.hidden = true;
    if (window.EdwinOSIntro) window.EdwinOSIntro.dismiss('deadline');
  }, 7000);
})();
</script>
{% else %}
<div class="edwinos-intro" id="edwinos-intro" hidden role="dialog" aria-modal="true" tabindex="-1" aria-label="Opening Edwin's notebook" aria-hidden="true" data-search-exclude>
  <div class="edwinos-intro__ripple" aria-hidden="true">
    {% for y in range(-3, 4) %}{% for x in range(-4, 5) %}
    <span style="--cell-x:{{ x }};--cell-y:{{ y }};--cell-delay:{{ ((x*x + y*y)**0.5 * 68)|round|int }}ms"></span>
    {% endfor %}{% endfor %}
  </div>
  <div class="edwinos-intro__scene">
    <span class="edwinos-intro__seed" aria-hidden="true"></span>
    <div class="edwinos-intro__box edwinos-glass">
      <p class="edwinos-intro__question" aria-hidden="true"><span data-intro-question></span><span class="edwinos-intro__cursor">|</span></p>
      <svg class="edwinos-intro__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle class="edwinos-intro__icon-halo" cx="12" cy="12" r="8.1"/>
        <circle class="edwinos-intro__icon-ring" cx="9" cy="9" r="5.1" pathLength="100"/>
        <path class="edwinos-intro__icon-handle" d="m12.6 12.6 7.5 7.5" pathLength="100"/>
        <path class="edwinos-intro__icon-check" d="m8 12 2.7 2.8 5.5-6" pathLength="100"/>
      </svg>
    </div>
    <span class="edwinos-intro__status" role="status" aria-live="polite"></span>
  </div>
</div>
{% endif %}
